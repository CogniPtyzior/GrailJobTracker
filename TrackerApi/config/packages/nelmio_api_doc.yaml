nelmio_api_doc:
    documentation:
        info:
            title: GrailJob Tracker API
            description: Minimal MVP API for tracked job applications and access requests.
            version: 1.0.0
        components:
            securitySchemes:
                SessionCookie:
                    type: apiKey
                    in: cookie
                    name: '%env(SESSION_COOKIE_NAME)%'
        security:
            - SessionCookie: []
    areas:
        path_patterns:
            - ^/api(?!/docs)
