doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling: false
        profiling_collect_backtrace: false

    orm:
        entity_managers:
            default:
                connection: default
                auto_mapping: false
                validate_xml_mapping: false
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src'
                        prefix: 'App'
                        alias: App