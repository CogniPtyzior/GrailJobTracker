parameters:
    tracker.schema: '%env(TRACKER_SCHEMA)%'
    app.timezone: '%env(APP_TIMEZONE)%'
    access_request.notification_to: '%env(ACCESS_REQUEST_NOTIFICATION_TO)%'
    mailer.from_email: '%env(MAILER_FROM_EMAIL)%'
    mailer.from_name: '%env(MAILER_FROM_NAME)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Security\Domain\Repository\UserRepositoryInterface:
        alias: App\Security\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    App\AccessRequest\Domain\Repository\AccessRequestRepositoryInterface:
        alias: App\AccessRequest\Infrastructure\Doctrine\Repository\DoctrineAccessRequestRepository

    App\TrackedJob\Domain\Repository\TrackedJobRepositoryInterface:
        alias: App\TrackedJob\Infrastructure\Doctrine\Repository\DoctrineTrackedJobRepository

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Shared/Domain/ValueObject/'
            - '../src/AccessRequest/Domain/Entity/'
            - '../src/AccessRequest/Domain/ValueObject/'
            - '../src/AccessRequest/Infrastructure/Doctrine/Entity/'
            - '../src/Security/Domain/Entity/'
            - '../src/Security/Domain/ValueObject/'
            - '../src/Security/Infrastructure/Doctrine/Entity/'
            - '../src/TrackedJob/Domain/Entity/'
            - '../src/TrackedJob/Domain/ValueObject/'
            - '../src/TrackedJob/Infrastructure/Doctrine/Entity/'

    App\Shared\Infrastructure\Clock\ClockInterface:
        class: App\Shared\Infrastructure\Clock\SystemClock
        arguments:
            $timezone: '%app.timezone%'

    App\Admin\Presentation\AdminUserController:
        arguments:
            $adminBootstrapEmail: '%env(ADMIN_BOOTSTRAP_EMAIL)%'

    App\Admin\Application\UseCase\UpdateAdminUser:
        arguments:
            $adminBootstrapEmail: '%env(ADMIN_BOOTSTRAP_EMAIL)%'

    App\Security\Infrastructure\Console\BootstrapAdminCommand:
        arguments:
            $adminBootstrapEmail: '%env(ADMIN_BOOTSTRAP_EMAIL)%'
            $adminBootstrapPasswordFile: '%env(ADMIN_BOOTSTRAP_PASSWORD_FILE)%'
            $trackerSchema: '%tracker.schema%'

    App\AccessRequest\Application\Notification\AccessRequestNotificationSender:
        arguments:
            $recipientEmail: '%access_request.notification_to%'
            $fromEmail: '%mailer.from_email%'
            $fromName: '%mailer.from_name%'

    App\AccessRequest\Presentation\PublicAccessRequestController:
        arguments:
            $accessRequestSubmissionLimiter: '@limiter.access_request_submission'

