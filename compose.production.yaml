services:
  tracker-api-php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: grailjobtracker-trackerapi-php
    working_dir: /var/www/tracker-api
    command: ["/usr/local/bin/app-entrypoint.sh"]
    env_file:
      - ./.env.docker.production
    environment:
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=tracker-api}
    volumes:
      - ./TrackerApi:/var/www/tracker-api
      - ./credentials/password.secret:/run/secrets/tracker_admin_password:ro
      - ./credentials/smtp/password.secret:/run/secrets/smtp_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tracker-api
      - grailjob-db-net

  tracker-api-nginx:
    image: nginx:stable-alpine
    container_name: grailjobtracker-trackerapi-nginx
    depends_on:
      - tracker-api-php
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./TrackerApi:/var/www/tracker-api:ro
      - ./docker/nginx/conf.d/tracker-api.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tracker-api

networks:
  tracker-api:
    driver: bridge
    
  grailjob-db-net:
    external: true
    name: grailjob_default