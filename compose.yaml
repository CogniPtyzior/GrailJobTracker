services:
  tracker-api-php:
    profiles: ["legacy"]
    image: grailjobtracker-tracker-api-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: grailjobtracker-trackerapi-php
    working_dir: /var/www/tracker-api
    command: ["/usr/local/bin/app-entrypoint.sh"]
    env_file:
      - ./.env.docker.local
    environment:
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=tracker-api}
    volumes:
      - tracker-api-runtime:/var/www/tracker-api/var/runtime
      - ./credentials/password.secret:/run/secrets/tracker_admin_password:ro
      - ./credentials/smtp/password.secret:/run/secrets/smtp_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Runs Messenger messages in a dedicated container using the backend PHP image.
  tracker-api-worker:
    profiles: ["legacy"]
    image: grailjobtracker-tracker-api-php
    container_name: grailjobtracker-trackerapi-worker
    working_dir: /var/www/tracker-api
    command: ["/usr/local/bin/app-entrypoint.sh"]
    env_file:
      - ./.env.docker.local
    environment:
      APP_RUNTIME_MODE: worker
      APP_DEBUG: 0
      # Allows the worker to wait for Composer, migrations and admin bootstrap in dev.
      WAIT_FOR_BACKEND_TIMEOUT: 600
      AUTO_COMPOSER_INSTALL: 0
      AUTO_INIT_DB: 0
      AUTO_MIGRATE: 0
      AUTO_BOOTSTRAP_ADMIN: 0
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG:-serverName=tracker-api}
    volumes:
      - tracker-api-runtime:/var/www/tracker-api/var/runtime
      - ./credentials/smtp/password.secret:/run/secrets/smtp_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tracker-api-php
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  tracker-api-nginx:
    profiles: ["legacy"]
    image: grailjobtracker-tracker-api-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: grailjobtracker-trackerapi-nginx
    depends_on:
      - tracker-api-php
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  tracker-api-platform-php:
    image: grailjobtracker-tracker-api-platform-php
    build:
      context: .
      dockerfile: docker/php-api-platform/Dockerfile
    container_name: grailjobtracker-trackerapiplatform-php
    working_dir: /var/www/tracker-api-platform
    command: ["/usr/local/bin/app-entrypoint.sh"]
    env_file:
      - ./.env.docker.local
    environment:
      APP_DIR: /var/www/tracker-api-platform
      APP_LOG_PREFIX: tracker-api-platform
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG_PLATFORM:-serverName=tracker-api-platform}
      DEFAULT_URI: http://127.0.0.1:8082
      XDEBUG_CLIENT_PORT: 9004
      AUTO_MIGRATE: 1
      AUTO_BOOTSTRAP_ADMIN: 1
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/tracker_admin_password
    volumes:
      - tracker-api-platform-runtime:/var/www/tracker-api-platform/var/runtime
      - ./credentials/password.secret:/run/secrets/tracker_admin_password:ro
      - ./credentials/smtp/password.secret:/run/secrets/smtp_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Runs API Platform Messenger messages once the new backend owns async processing.
  tracker-api-platform-worker:
    image: grailjobtracker-tracker-api-platform-php
    container_name: grailjobtracker-trackerapiplatform-worker
    working_dir: /var/www/tracker-api-platform
    command: ["/usr/local/bin/app-entrypoint.sh"]
    profiles:
      - api-platform-worker
    env_file:
      - ./.env.docker.local
    environment:
      APP_DIR: /var/www/tracker-api-platform
      APP_LOG_PREFIX: tracker-api-platform-worker
      APP_RUNTIME_MODE: worker
      APP_DEBUG: 0
      WAIT_FOR_BACKEND_TIMEOUT: 600
      AUTO_COMPOSER_INSTALL: 0
      AUTO_INIT_DB: 0
      AUTO_MIGRATE: 0
      AUTO_BOOTSTRAP_ADMIN: 0
      PHP_IDE_CONFIG: ${PHP_IDE_CONFIG_PLATFORM:-serverName=tracker-api-platform}
      DEFAULT_URI: http://127.0.0.1:8082
      XDEBUG_CLIENT_PORT: 9004
      OTEL_SERVICE_NAME: grailjob-worker
    volumes:
      - tracker-api-platform-runtime:/var/www/tracker-api-platform/var/runtime
      - ./credentials/smtp/password.secret:/run/secrets/smtp_password:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tracker-api-platform-php
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  tracker-api-platform-nginx:
    image: grailjobtracker-tracker-api-platform-nginx
    build:
      context: .
      dockerfile: docker/nginx-api-platform/Dockerfile
    container_name: grailjobtracker-trackerapiplatform-nginx
    depends_on:
      - tracker-api-platform-php
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - tracker-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - tracker-api
    restart: unless-stopped

volumes:
  tracker-api-runtime:
  tracker-api-platform-runtime:
networks:
  tracker-api:
    driver: bridge
