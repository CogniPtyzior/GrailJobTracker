parameters:
    env(ACCESS_REQUEST_NOTIFICATION_TO): 'admin@example.local'
    env(MAILER_FROM_EMAIL): 'no-reply@example.local'
    env(MAILER_FROM_NAME): 'GrailJob Tracker'
services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Shared\Application\Clock\ClockInterface:
        alias: App\Shared\Infrastructure\Clock\SystemClock

    App\Security\Domain\Repository\UserRepositoryInterface:
        alias: App\Security\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    App\TrackedJob\Domain\Repository\TrackedJobRepositoryInterface:
        alias: App\TrackedJob\Infrastructure\Doctrine\Repository\DoctrineTrackedJobRepository

    App\AccessRequest\Domain\Repository\AccessRequestRepositoryInterface:
        alias: App\AccessRequest\Infrastructure\Doctrine\Repository\DoctrineAccessRequestRepository

    App\AccessRequest\Api\RateLimit\AccessRequestSubmissionLimiterInterface:
        alias: App\AccessRequest\Api\RateLimit\AccessRequestSubmissionLimiter

    App\AccessRequest\Application\Notification\AccessRequestNotificationDispatcherInterface:
        alias: App\AccessRequest\Infrastructure\Messenger\MessengerAccessRequestNotificationDispatcher

    App\AccessRequest\Infrastructure\Notification\AccessRequestNotificationSender:
        arguments:
            $recipientEmail: '%env(ACCESS_REQUEST_NOTIFICATION_TO)%'
            $fromEmail: '%env(MAILER_FROM_EMAIL)%'
            $fromName: '%env(MAILER_FROM_NAME)%'

