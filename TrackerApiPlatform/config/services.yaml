services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        # AccessRequest use cases are enabled once the Doctrine repository adapter exists in P18.
        exclude:
            - '../src/AccessRequest/Application/UseCase/'

    App\Shared\Application\Clock\ClockInterface:
        alias: App\Shared\Infrastructure\Clock\SystemClock

    App\Security\Domain\Repository\UserRepositoryInterface:
        alias: App\Security\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    App\TrackedJob\Domain\Repository\TrackedJobRepositoryInterface:
        alias: App\TrackedJob\Infrastructure\Doctrine\Repository\DoctrineTrackedJobRepository

    # The Messenger dispatcher replaces this no-op adapter in P20.
    App\AccessRequest\Application\Notification\AccessRequestNotificationDispatcherInterface:
        alias: App\AccessRequest\Application\Notification\NullAccessRequestNotificationDispatcher

