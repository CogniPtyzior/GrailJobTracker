services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Shared\Application\Clock\ClockInterface:
        alias: App\Shared\Infrastructure\Clock\SystemClock

    App\Security\Domain\Repository\UserRepositoryInterface:
        alias: App\Security\Infrastructure\Doctrine\Repository\DoctrineUserRepository

    App\TrackedJob\Domain\Repository\TrackedJobRepositoryInterface:
        alias: App\TrackedJob\Infrastructure\Doctrine\Repository\DoctrineTrackedJobRepository
