monolog:
    handlers:
        main:
            type: stream
            path: php://stderr
            level: info
            formatter: monolog.formatter.json
            channels: ["!event", "!doctrine", "!console", "!request", "!security", "!messenger"]

        otel:
            type: service
            id: OpenTelemetry\Contrib\Logs\Monolog\Handler
            level: info
            channels: ['app']
