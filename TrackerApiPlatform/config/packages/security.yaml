security:
    password_hashers:
        App\Security\Infrastructure\Security\SecurityUser:
            algorithm: auto

    providers:
        app_user_provider:
            id: App\Security\Infrastructure\Security\DomainUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\Infrastructure\Security\ActiveUserChecker
            entry_point: App\Security\Infrastructure\Security\JsonAuthenticationEntryPoint
            custom_authenticators:
                - App\Security\Infrastructure\Security\JsonLoginAuthenticator
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: /api/auth/logout
                invalidate_session: true

    access_control:
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/auth/me$, roles: IS_AUTHENTICATED_FULLY, methods: [GET] }
        - { path: ^/api/auth/logout$, roles: IS_AUTHENTICATED_FULLY, methods: [POST] }
        - { path: ^/api/access-requests$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Security\Infrastructure\Security\SecurityUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
